<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Phần Mềm Quản Lý ATVSLD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      background: #f0f4f8;
    }

    /* ===== LEFT PANEL ===== */
    .left-panel {
      flex: 1;
      /* FIX: gradient nhạt hơn, ít saturated hơn, khớp với thiết kế */
      background: linear-gradient(145deg, #f0f8ff 0%, #ddf0fa 30%, #b8dcf5 60%, #8ec8e8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(100,190,240,0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .illustration {
      position: relative;
      width: 420px;
      height: 390px;
    }

    /* ── Laptop lid / screen ── */
    .laptop-screen {
      position: absolute;
      top: 15px;
      left: 55px;
      width: 290px;
      height: 165px;
      background: #1a56db;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 10px 30px rgba(26,86,219,0.4);
      overflow: hidden;
    }

    .laptop-screen::before {
      content: '';
      position: absolute;
      inset: 8px;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%);
      border-radius: 6px;
    }

    /* Checklist on screen */
    .checklist {
      position: absolute;
      top: 22px;
      left: 20px;
      right: 20px;
      z-index: 2;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .check-bar {
      height: 10px;
      border-radius: 5px;
      background: rgba(255,255,255,0.22);
      flex: 1;
    }

    .check-bar.done { background: rgba(255,255,255,0.75); }

    .check-icon {
      width: 18px;
      height: 18px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-icon svg { width: 10px; height: 10px; }

    /* ── Laptop hinge ── */
    .laptop-hinge {
      position: absolute;
      top: 178px;
      left: 48px;
      width: 304px;
      height: 11px;
      background: linear-gradient(180deg, #1245b0 0%, #0e3080 100%);
    }

    /* ── Laptop keyboard body ── */
    .laptop-body {
      position: absolute;
      top: 189px;
      left: 40px;
      width: 320px;
      height: 118px;
      background: linear-gradient(180deg, #1a56db 0%, #1040a8 100%);
      border-radius: 0 0 10px 10px;
      box-shadow: 0 8px 24px rgba(26,86,219,0.35);
      padding: 8px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .keyboard-area {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .key-row {
      display: flex;
      gap: 2px;
      justify-content: center;
    }

    .key {
      width: 20px;
      height: 12px;
      background: rgba(255,255,255,0.17);
      border-radius: 2px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .key-wide  { width: 30px; }
    .key-xwide { width: 44px; }
    .key-space { width: 90px; }

    .trackpad {
      width: 60px;
      height: 26px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* ── Laptop shadow ── */
    .laptop-shadow {
      position: absolute;
      top: 307px;
      left: 60px;
      width: 290px;
      height: 8px;
      background: rgba(26,86,219,0.18);
      border-radius: 50%;
      filter: blur(5px);
    }

    /* ── Number circles ── */
    .num-circle {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f97316;   /* FIX: tất cả 3 vòng tròn đều màu cam */
      color: white;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(249,115,22,0.5);
      z-index: 10;
    }

    .num-1 { top: 118px; left: 18px; }
    .num-2 { top: 248px; left: 92px; }
    .num-3 { top: 8px;   right: 76px; }

    /* ── People figures ── */
    .person-left {
      position: absolute;
      left: 12px;
      bottom: 60px;
    }

    .person-right {
      position: absolute;
      right: 28px;
      bottom: 52px;
    }

    .person-mid {
      position: absolute;
      right: 82px;
      bottom: 32px;
    }

    /* ===== RIGHT PANEL ===== */
    /* FIX: dùng tỉ lệ % có chặn min/max thay cho width cố định 420px,
       để tỉ lệ trái/phải cân đối trên mọi kích thước màn (bám ~1/3 như thiết kế) */
    .right-panel {
      flex: 0 0 36%;
      min-width: 400px;
      max-width: 520px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 56px;
      box-shadow: -4px 0 30px rgba(0,0,0,0.08);
    }

    /* Giới hạn bề rộng nội dung form để input không bị kéo quá dài khi panel rộng */
    .right-panel > * { max-width: 340px; }

    .gov-seal {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-section-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      width: 100%;
    }

    .alert {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }

    .alert-error {
      background: #fff1f0;
      border: 1px solid #fca5a5;
      color: #b91c1c;
    }

    .alert-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alert-close {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }

    .alert-close:hover { color: #374151; }

    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      display: block;
    }

    .form-control {
      width: 100%;
      height: 40px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 0 40px 0 12px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }

    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-control.error { border-color: #ef4444; }

    .input-wrapper { position: relative; }

    .input-suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #9ca3af;
    }

    .input-suffix:hover { color: #374151; }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1d4ed8;
      cursor: pointer;
    }

    .link-text {
      font-size: 13px;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 500;
    }

    .link-text:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      height: 42px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }

    .btn-primary:hover  { background: #1e40af; }
    .btn-primary:active { background: #1e3a8a; }

    .divider-link {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .divider-link a {
      color: #1d4ed8;
      font-weight: 500;
      text-decoration: none;
    }

    .divider-link a:hover { text-decoration: underline; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="illustration">

      <!-- Laptop screen (lid) -->
      <div class="laptop-screen">
        <div class="checklist">
          <div class="check-item">
            <div class="check-icon">
              <svg viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="check-bar done"></div>
          </div>
          <div class="check-item">
            <div class="check-icon">
              <svg viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="check-bar done"></div>
          </div>
          <div class="check-item">
            <div class="check-icon" style="background:#94a3b8;">
              <svg viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="check-bar"></div>
          </div>
        </div>
      </div>

      <!-- Hinge -->
      <div class="laptop-hinge"></div>

      <!-- Keyboard body (generated by JS) -->
      <div class="laptop-body">
        <div class="keyboard-area" id="keyboard"></div>
        <div class="trackpad"></div>
      </div>

      <div class="laptop-shadow"></div>

      <!-- Number circles — tất cả đều màu cam #f97316 -->
      <div class="num-circle num-1">1</div>
      <div class="num-circle num-2">2</div>
      <div class="num-circle num-3">3</div>

      <!-- People -->
      <svg class="person-left" viewBox="0 0 50 90" width="40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="14" r="10" fill="#fbbf24"/>
        <rect x="14" y="26" width="22" height="36" rx="6" fill="#1d4ed8"/>
        <rect x="6"  y="28" width="10" height="24" rx="5" fill="#1d4ed8"/>
        <rect x="34" y="28" width="10" height="24" rx="5" fill="#1d4ed8"/>
        <rect x="15" y="62" width="9"  height="22" rx="4" fill="#1e3a8a"/>
        <rect x="26" y="62" width="9"  height="22" rx="4" fill="#1e3a8a"/>
      </svg>

      <svg class="person-right" viewBox="0 0 50 90" width="38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="14" r="10" fill="#f97316"/>
        <rect x="14" y="26" width="22" height="36" rx="6" fill="#22c55e"/>
        <rect x="6"  y="28" width="10" height="24" rx="5" fill="#22c55e"/>
        <rect x="34" y="28" width="10" height="20" rx="5" fill="#22c55e"/>
        <rect x="15" y="62" width="9"  height="22" rx="4" fill="#166534"/>
        <rect x="26" y="62" width="9"  height="22" rx="4" fill="#166534"/>
      </svg>

      <svg class="person-mid" viewBox="0 0 50 90" width="34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="14" r="10" fill="#fbbf24"/>
        <rect x="14" y="26" width="22" height="36" rx="6" fill="#7c3aed"/>
        <rect x="6"  y="28" width="10" height="18" rx="5" fill="#7c3aed"/>
        <rect x="34" y="28" width="10" height="24" rx="5" fill="#7c3aed"/>
        <rect x="15" y="62" width="9"  height="22" rx="4" fill="#4c1d95"/>
        <rect x="26" y="62" width="9"  height="22" rx="4" fill="#4c1d95"/>
      </svg>

    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <svg class="gov-seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="#c0392b" stroke="#f39c12" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="#c0392b" stroke="#f1c40f" stroke-width="1.5"/>
      <polygon points="50,18 54,34 70,34 58,44 62,60 50,50 38,60 42,44 30,34 46,34" fill="#f1c40f"/>
      <path d="M22 72 Q18 65 22 58 L28 62 Q26 65 28 68 Z" fill="#f1c40f"/>
      <path d="M20 72 Q16 75 20 82 Q24 78 22 74 Z" fill="#f1c40f" transform="rotate(-15,20,77)"/>
      <path d="M24 70 Q20 73 22 80 Q26 76 26 72 Z" fill="#f1c40f" transform="rotate(-8,23,75)"/>
      <path d="M80 72 Q84 75 80 82 Q76 78 78 74 Z" fill="#f1c40f" transform="rotate(15,80,77)"/>
      <path d="M76 70 Q80 73 78 80 Q74 76 74 72 Z" fill="#f1c40f" transform="rotate(8,77,75)"/>
      <path d="M32 85 Q50 92 68 85 Q60 88 50 89 Q40 88 32 85Z" fill="#f1c40f"/>
    </svg>

    <div class="app-title">
      Phần Mềm Quản Lý - Tạo Lập Cơ Sở Dữ Liệu<br>
      An Toàn Vệ Sinh Lao Động
    </div>

    <div class="form-section-label">ĐĂNG NHẬP</div>

    <div class="alert alert-error hidden" id="alertBox">
      <div class="alert-icon">!</div>
      <span id="alertMsg">Tài khoản hoặc mật khẩu không đúng. Xin vui lòng thử lại</span>
      <button class="alert-close" onclick="closeAlert()">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Tên đăng nhập *</label>
      <div class="input-wrapper">
        <input type="text" class="form-control" id="username" placeholder="nguyenvan3.sts" autocomplete="username" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Mật khẩu *</label>
      <div class="input-wrapper">
        <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" />
        <span class="input-suffix" onclick="togglePassword()" title="Hiện/ẩn mật khẩu">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" id="rememberMe" />
        Nhớ đăng nhập
      </label>
      <a href="khoiphucmatkhau.html" class="link-text">Quên mật khẩu</a>
    </div>

    <button class="btn-primary" onclick="handleLogin()">Đăng nhập</button>

    <div class="divider-link">
      <a href="dangkydoanhnghiep.html">Đăng ký tài khoản doanh nghiệp</a>
    </div>

  </div>

  <script>
    // Generate keyboard rows
    (function () {
      const kb = document.getElementById('keyboard');
      // 4 regular rows + 1 space row
      [13, 12, 11, 10].forEach(count => {
        const row = document.createElement('div');
        row.className = 'key-row';
        for (let i = 0; i < count; i++) {
          const k = document.createElement('div');
          k.className = 'key';
          row.appendChild(k);
        }
        kb.appendChild(row);
      });
      // Space bar row
      const spaceRow = document.createElement('div');
      spaceRow.className = 'key-row';
      [['key key-wide'], ['key key-space'], ['key key-wide'], ['key key-wide']].forEach(([cls]) => {
        const k = document.createElement('div');
        k.className = cls;
        spaceRow.appendChild(k);
      });
      kb.appendChild(spaceRow);
    })();

    function togglePassword() {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23" stroke-width="2" stroke-linecap="round"/>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function showAlert(msg) {
      document.getElementById('alertMsg').textContent = msg;
      document.getElementById('alertBox').classList.remove('hidden');
    }

    function closeAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const uCtrl   = document.getElementById('username');
      const pCtrl   = document.getElementById('password');

      uCtrl.classList.remove('error');
      pCtrl.classList.remove('error');
      closeAlert();

      if (!username) { uCtrl.classList.add('error'); showAlert('Vui lòng nhập đầy đủ thông tin'); return; }
      if (!password) { pCtrl.classList.add('error'); showAlert('Vui lòng nhập đầy đủ thông tin'); return; }
      if (username !== 'admin' || password !== '123456') {
        showAlert('Tài khoản hoặc mật khẩu không đúng. Xin vui lòng thử lại');
        return;
      }

      window.location.href = 'thongtintaikhoan.html';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
