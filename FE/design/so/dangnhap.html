<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Phần Mềm Quản Lý ATVSLD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      background: #f0f4f8;
    }

    /* ===== LEFT PANEL ===== */
    .left-panel {
      flex: 1;
      /* gradient nhạt, ít saturated, khớp với nền minh hoạ login.png */
      background: linear-gradient(145deg, #f0f8ff 0%, #ddf0fa 30%, #b8dcf5 60%, #8ec8e8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(100,190,240,0.25) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Ảnh minh hoạ đăng nhập (thay cho illustration dựng tay trước đây) */
    .illustration-img {
      position: relative;
      z-index: 1;
      width: 80%;
      max-width: 460px;
      height: auto;
    }

    /* ===== RIGHT PANEL ===== */
    /* dùng tỉ lệ % có chặn min/max thay cho width cố định 420px,
       để tỉ lệ trái/phải cân đối trên mọi kích thước màn (bám ~1/3 như thiết kế) */
    .right-panel {
      flex: 0 0 36%;
      min-width: 400px;
      max-width: 520px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 56px;
      box-shadow: -4px 0 30px rgba(0,0,0,0.08);
    }

    /* Giới hạn bề rộng nội dung form để input không bị kéo quá dài khi panel rộng */
    .right-panel > * { max-width: 340px; }

    .gov-seal {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-section-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      width: 100%;
    }

    .alert {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }

    .alert-error {
      background: #fff1f0;
      border: 1px solid #fca5a5;
      color: #b91c1c;
    }

    .alert-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alert-close {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }

    .alert-close:hover { color: #374151; }

    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      display: block;
    }

    .form-control {
      width: 100%;
      height: 40px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 0 40px 0 12px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }

    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-control.error { border-color: #ef4444; }

    .input-wrapper { position: relative; }

    .input-suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #9ca3af;
    }

    .input-suffix:hover { color: #374151; }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1d4ed8;
      cursor: pointer;
    }

    .link-text {
      font-size: 13px;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 500;
    }

    .link-text:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      height: 42px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }

    .btn-primary:hover  { background: #1e40af; }
    .btn-primary:active { background: #1e3a8a; }

    .divider-link {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }

    .divider-link a {
      color: #1d4ed8;
      font-weight: 500;
      text-decoration: none;
    }

    .divider-link a:hover { text-decoration: underline; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <img class="illustration-img" src="/login.png" alt="Minh hoạ đăng nhập" />
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <svg class="gov-seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="#c0392b" stroke="#f39c12" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="#c0392b" stroke="#f1c40f" stroke-width="1.5"/>
      <polygon points="50,18 54,34 70,34 58,44 62,60 50,50 38,60 42,44 30,34 46,34" fill="#f1c40f"/>
      <path d="M22 72 Q18 65 22 58 L28 62 Q26 65 28 68 Z" fill="#f1c40f"/>
      <path d="M20 72 Q16 75 20 82 Q24 78 22 74 Z" fill="#f1c40f" transform="rotate(-15,20,77)"/>
      <path d="M24 70 Q20 73 22 80 Q26 76 26 72 Z" fill="#f1c40f" transform="rotate(-8,23,75)"/>
      <path d="M80 72 Q84 75 80 82 Q76 78 78 74 Z" fill="#f1c40f" transform="rotate(15,80,77)"/>
      <path d="M76 70 Q80 73 78 80 Q74 76 74 72 Z" fill="#f1c40f" transform="rotate(8,77,75)"/>
      <path d="M32 85 Q50 92 68 85 Q60 88 50 89 Q40 88 32 85Z" fill="#f1c40f"/>
    </svg>

    <div class="app-title">
      Phần Mềm Quản Lý - Tạo Lập Cơ Sở Dữ Liệu<br>
      An Toàn Vệ Sinh Lao Động
    </div>

    <div class="form-section-label">ĐĂNG NHẬP</div>

    <div class="alert alert-error hidden" id="alertBox">
      <div class="alert-icon">!</div>
      <span id="alertMsg">Tài khoản hoặc mật khẩu không đúng. Xin vui lòng thử lại</span>
      <button class="alert-close" onclick="closeAlert()">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Tên đăng nhập *</label>
      <div class="input-wrapper">
        <input type="text" class="form-control" id="username" placeholder="nguyenvan3.sts" autocomplete="username" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Mật khẩu *</label>
      <div class="input-wrapper">
        <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" />
        <span class="input-suffix" onclick="togglePassword()" title="Hiện/ẩn mật khẩu">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" id="rememberMe" />
        Nhớ đăng nhập
      </label>
      <a href="khoiphucmatkhau.html" class="link-text">Quên mật khẩu</a>
    </div>

    <button class="btn-primary" onclick="handleLogin()">Đăng nhập</button>

    <div class="divider-link">
      <a href="dangkydoanhnghiep.html">Đăng ký tài khoản doanh nghiệp</a>
    </div>

  </div>

  <script>
    function togglePassword() {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23" stroke-width="2" stroke-linecap="round"/>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function showAlert(msg) {
      document.getElementById('alertMsg').textContent = msg;
      document.getElementById('alertBox').classList.remove('hidden');
    }

    function closeAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const uCtrl   = document.getElementById('username');
      const pCtrl   = document.getElementById('password');

      uCtrl.classList.remove('error');
      pCtrl.classList.remove('error');
      closeAlert();

      if (!username) { uCtrl.classList.add('error'); showAlert('Vui lòng nhập đầy đủ thông tin'); return; }
      if (!password) { pCtrl.classList.add('error'); showAlert('Vui lòng nhập đầy đủ thông tin'); return; }
      if (username !== 'admin' || password !== '123456') {
        showAlert('Tài khoản hoặc mật khẩu không đúng. Xin vui lòng thử lại');
        return;
      }

      window.location.href = 'thongtintaikhoan.html';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
